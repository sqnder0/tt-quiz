<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Een vierkant frame van vier palen dat scheef zakt, met een vraagteken in het midden">
  <defs>
    <linearGradient id="wood3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d29a5c"/>
      <stop offset="1" stop-color="#96592a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="18" fill="#f3ead6"/>

  <!-- de scheefgezakte stand, in stippellijn -->
  <g stroke="#c2a97e" stroke-width="5" stroke-dasharray="9 9" fill="none" stroke-linecap="round">
    <path d="M112 240 L152 70 L312 70 L272 240 Z"/>
  </g>

  <!-- het frame zoals het hoort te staan -->
  <g stroke="#7c4a1e" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M104 240 L104 70"/>
    <path d="M264 240 L264 70"/>
    <path d="M96 74 L272 74"/>
    <path d="M96 236 L272 236"/>
  </g>
  <g stroke="url(#wood3)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M104 240 L104 70"/>
    <path d="M264 240 L264 70"/>
    <path d="M96 74 L272 74"/>
    <path d="M96 236 L272 236"/>
  </g>

  <!-- sjorringen op de hoeken -->
  <g fill="#efe0b8" stroke="#c7ab72" stroke-width="1.6">
    <rect x="88" y="58" width="32" height="32" rx="7"/>
    <rect x="248" y="58" width="32" height="32" rx="7"/>
    <rect x="88" y="220" width="32" height="32" rx="7"/>
    <rect x="248" y="220" width="32" height="32" rx="7"/>
  </g>

  <!-- pijlen: het frame wil omvallen -->
  <g stroke="#e0543a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 92 q34 12 34 46"/>
    <path d="M326 128 l8 12 12 -8"/>
    <path d="M84 92 q-34 12 -34 46" opacity="0.55"/>
  </g>

  <text x="184" y="176" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="86" font-weight="bold" fill="#2f7a4a" text-anchor="middle">?</text>
</svg>
